# DepGuard — Per-Repo Cron Workflow Template
#
# Copy this file to your repo as .github/workflows/depguard.yml
# Customize the cron schedule below.
#
# The actual scan logic lives in the central reusable workflow at:
#   razorpay/.github/.github/workflows/depguard-reusable.yml
#
# You also need:
#   1. .github/depguard.yml       — per-repo config (see config/depguard.yml.example)
#   2. .github/repo_owners.json   — manager/team info (see config/repo_owners.json.example)
#   3. Repo secrets: SLASH_PROD_CI_USER, SLASH_PROD_CI_PASS
#      (set at org level or per-repo: Settings → Secrets and variables → Actions)

name: DepGuard

on:
  schedule:
    # ┌───────────── minute (0-59)
    # │ ┌───────────── hour (0-23)
    # │ │ ┌───────────── day of month (1-31)
    # │ │ │ ┌───────────── month (1-12)
    # │ │ │ │ ┌───────────── day of week (0-6 = Sunday-Saturday)
    # │ │ │ │ │
    # Default: every Monday at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * 1'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  depguard:
    uses: razorpay/.github/.github/workflows/depguard-reusable.yml@master
    with:
      repo-full-name: ${{ github.repository }}
      repo-default-branch: master  # change to 'main' if your repo uses main
      # Optional: override defaults
      # follow-up-emails: "person1@razorpay.com,person2@razorpay.com"
    secrets:
      SLASH_PROD_CI_USER: ${{ secrets.SLASH_PROD_CI_USER }}
      SLASH_PROD_CI_PASS: ${{ secrets.SLASH_PROD_CI_PASS }}
